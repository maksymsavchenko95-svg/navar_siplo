steps:
  - Капустяне листя пробланшувати до м'якості.
  - Фарш змішати з відвареним рисом і пасерованою цибулею з морквою.
  - Загорнути голубці, залити томатною пастою зі сметаною та водою, тушкувати 1 годину.
