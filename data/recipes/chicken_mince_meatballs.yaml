slug: chicken_mince_meatballs
titleUk: Тефтелі з курячого фаршу в підливі
servings: 4
activeMinutes: 25
totalMinutes: 45
difficulty: 2
mealType: dinner
seasons: [all_year]
tags: [kids_friendly, reheatable]
steps:
  - Фарш змішати з відвареним рисом, цибулею та яйцем, сформувати кульки.
  - Обсмажити тефтелі, залити томатною підливою з водою.
  - Тушкувати під кришкою 20 хвилин.
