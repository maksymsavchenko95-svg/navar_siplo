slug: cauliflower_cheese_bake
titleUk: Цвітна капуста під сирним соусом
servings: 3
activeMinutes: 20
totalMinutes: 40
difficulty: 2
mealType: dinner
seasons: [autumn, winter]
tags: [vegetarian, kids_friendly]
steps:
  - Цвітну капусту розібрати й відварити 5 хвилин.
  - Приготувати соус з масла, борошна й молока, додати тертий сир.
  - Залити капусту соусом, запікати 20 хвилин за 190°C.
