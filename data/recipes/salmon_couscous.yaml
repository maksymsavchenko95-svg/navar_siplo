slug: salmon_couscous
titleUk: Лосось з кускусом і овочами
servings: 3
activeMinutes: 20
totalMinutes: 30
difficulty: 2
mealType: dinner
seasons: [spring, summer]
tags: [quick]
steps:
  - Кускус залити окропом 1:1,5, лишити на 5 хвилин, розпушити виделкою.
  - Філе лосося посолити, обсмажити по 3 хвилини з кожного боку.
  - Цукіні й перець підсмажити, з'єднати з кускусом, подати з лососем.
