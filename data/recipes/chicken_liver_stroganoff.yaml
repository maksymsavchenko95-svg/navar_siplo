slug: chicken_liver_stroganoff
titleUk: Куряча печінка у сметані
servings: 3
activeMinutes: 20
totalMinutes: 30
difficulty: 2
mealType: dinner
seasons: [all_year]
tags: [quick, budget]
steps:
  - Печінку обсмажити на сильному вогні 5 хвилин, відкласти.
  - Спасерувати цибулю, додати сметану й ложку борошна, влити воду.
  - Повернути печінку, тушкувати 7 хвилин, подати з гречкою.
