slug: baked_cod_gratin_trout
titleUk: Форель, запечена під сметанним соусом
servings: 3
activeMinutes: 15
totalMinutes: 35
difficulty: 2
mealType: dinner
seasons: [all_year]
tags: [quick, gluten_free]
steps:
  - Філе форелі посолити, викласти у форму.
  - Змішати сметану з часником і кропом, покрити рибу.
  - Запікати 20 хвилин за 190°C, подати з відвареною картоплею.
