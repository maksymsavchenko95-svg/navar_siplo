slug: turkey_bulgur_bake
titleUk: Запечена індичка з булгуром
servings: 4
activeMinutes: 20
totalMinutes: 45
difficulty: 2
mealType: dinner
seasons: [autumn, winter]
tags: [reheatable]
steps:
  - Булгур залити окропом 1:2, лишити під кришкою на 15 хвилин.
  - Філе індички нарізати, обсмажити з цибулею та морквою.
  - З'єднати з булгуром і бланшованою квасолею, викласти у форму.
  - Запікати 15 хвилин за 190°C.
ingredients:
