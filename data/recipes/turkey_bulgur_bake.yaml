  - { slug: onion, amount: 150, unit: g }
  - { slug: carrot, amount: 150, unit: g }
  - { slug: green_beans, amount: 200, unit: g }
  - { slug: olive_oil, amount: 30, unit: ml }
  - { slug: salt, amount: 6, unit: g }
