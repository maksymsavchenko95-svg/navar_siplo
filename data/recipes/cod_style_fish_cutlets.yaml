slug: cod_style_fish_cutlets
titleUk: Рибні котлети з хеку
servings: 4
activeMinutes: 30
totalMinutes: 45
difficulty: 2
mealType: dinner
seasons: [all_year]
tags: [kids_friendly, reheatable]
steps:
  - Філе хека подрібнити, змішати з цибулею, яйцем і сухарями.
  - Сформувати котлети, обваляти в сухарях.
  - Смажити по 4 хвилини з боку, подати з картопляним пюре.
