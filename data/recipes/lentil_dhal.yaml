slug: lentil_dhal
titleUk: Дал із сочевиці
servings: 3
activeMinutes: 15
totalMinutes: 40
difficulty: 1
mealType: dinner
seasons: [autumn, winter]
tags: [vegetarian, vegan, lenten, budget, one_pot]
steps:
  - Цибулю з часником та імбиром спасерувати на олії.
  - Додати куркуму й сочевицю, влити воду, варити 25 хвилин.
  - Влити кокосове молоко, посолити, прогріти 5 хвилин.
