steps:
  - Яловичину нарізати кубиками, обсмажити до рум'яності.
  - Додати цибулю, моркву й томатну пасту, влити воду.
  - Тушкувати під кришкою 1 годину.
  - Всипати відварену червону квасолю, готувати ще 15 хвилин.
