slug: salmon_potato_bake
titleUk: Запіканка з лососем і картоплею
servings: 4
activeMinutes: 25
totalMinutes: 55
difficulty: 2
mealType: dinner
seasons: [autumn, winter]
tags: [reheatable]
steps:
  - Картоплю відварити до напівготовності, нарізати кружальцями.
  - Викласти шарами картоплю, філе лосося та цибулю, залити вершками.
  - Посипати сиром, запікати 30 хвилин за 190°C.
