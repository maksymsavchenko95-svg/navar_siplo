slug: chicken_thigh_rice
titleUk: Курячі стегна з рисом
servings: 4
activeMinutes: 20
totalMinutes: 45
difficulty: 2
mealType: dinner
seasons: [all_year]
tags: [reheatable, one_pot, kids_friendly]
steps:
  - Стегна обсмажити до золотистої шкірочки, відкласти.
  - У тому ж посуді спасерувати цибулю й моркву, всипати рис.
  - Влити воду 1:2, повернути стегна, готувати під кришкою 25 хвилин.
