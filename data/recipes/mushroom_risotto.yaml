slug: mushroom_risotto
titleUk: Різото з грибами
servings: 3
activeMinutes: 25
totalMinutes: 40
difficulty: 3
mealType: dinner
seasons: [autumn, winter]
tags: [vegetarian]
steps:
  - Печериці обсмажити на вершковому маслі, відкласти.
  - Спасерувати цибулю, всипати рис, вливати гарячу воду частинами, помішуючи.
  - За 18 хвилин додати гриби й тертий сир, дати настоятися.
