# Golden mapping dataset — ingredient → expected Silpo SKU (NFR-MNT-003, TDD §5).
#
# Seeded in T2.1 (~40 pairs from the recipe corpus); grown to ≥100 under T5.3.
# Without a committed catalogue snapshot, an "expected SKU" is expressed as:
#   expectQueryContains / expectQueryExcludes — assertions on buildQuery(dictEntry),
#     checked on every run (packages/mapper/src/golden.test.ts). This is the regression
#     guard for query-normalisation and prompt edits.
#   expectCategory                            — the dictionary category (sanity).
#   acceptSkuKeywords                         — for the live hit-rate probe
#     (pnpm --filter @navar/api mapper:probe): ≥1 must appear in a returned SKU name.
#
# The M0 audit failure cases ("пучок кропу", "куряче філе охолоджене", "сметана 20%",
# "гречка ядриця") are pinned here as regression fixtures.

- slug: chicken_breast
  expectQueryContains: ["куряче", "філе"]
  expectQueryExcludes: ["охолоджен", "грудка"]
  expectCategory: meat
  acceptSkuKeywords: ["філе", "куряч"]

